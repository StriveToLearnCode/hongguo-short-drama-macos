name: Receive final verified installer
on:
  workflow_dispatch:
    inputs:
      version: {required: true, type: string}
      sha256: {required: true, type: string}
      size: {required: true, type: string}
      chunk_hashes: {required: true, type: string}
permissions:
  contents: write
jobs:
  receive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Receive only declared public package chunks and verify original installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          PACKAGE_SHA256: ${{ inputs.sha256 }}
          PACKAGE_SIZE: ${{ inputs.size }}
          CHUNK_HASHES: ${{ inputs.chunk_hashes }}
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib, http.server, json, os, pathlib, queue, re, socket, subprocess, tempfile, threading, time, urllib.request
          version=os.environ['RELEASE_VERSION']; expected=os.environ['PACKAGE_SHA256']; size=int(os.environ['PACKAGE_SIZE'])
          chunk_hashes=json.loads(os.environ['CHUNK_HASHES']); chunk_size=4*1024*1024
          if not re.fullmatch(r'\d+\.\d+\.\d+',version) or not re.fullmatch('[a-f0-9]{64}',expected) or not 0<size<=2_000_000_000:
              raise SystemExit('Invalid package identity')
          if len(chunk_hashes)!=(size+chunk_size-1)//chunk_size or any(not re.fullmatch('[a-f0-9]{64}',s) for s in chunk_hashes):
              raise SystemExit('Invalid chunk manifest')
          repo=os.environ['GH_REPO']; filename=f'HongguoMac-{version}-universal.dmg'
          def gh_json(*args):return json.loads(subprocess.check_output(['gh',*args]))
          def release():
              raw=next(r for r in gh_json('api',f'repos/{repo}/releases?per_page=100') if r['tag_name']==f'v{version}')
              return dict(isDraft=raw['draft'],isPrerelease=raw['prerelease'],assets=raw['assets'])
          def valid(asset):return asset.get('state')=='uploaded' and asset.get('size')==size and asset.get('digest')=='sha256:'+expected
          start=release()
          if not start['isDraft'] or start['isPrerelease']:raise SystemExit('Expected existing stable draft')
          old=next((a for a in start['assets'] if a['name']==filename),None)
          if old:
              if valid(old):print('Exact package already uploaded');raise SystemExit(0)
              raise SystemExit('Existing package differs; review before replacing')
          with tempfile.TemporaryDirectory(prefix='verified-release-receiver-') as temporary:
              work=pathlib.Path(temporary);received=set();lock=threading.Lock();slots=threading.BoundedSemaphore(8)
              class Receiver(http.server.BaseHTTPRequestHandler):
                  def log_message(self,*args):pass
                  def respond(self,status,body=b''):
                      self.send_response(status);self.send_header('Content-Length',str(len(body)));self.end_headers();self.wfile.write(body)
                  def do_GET(self):
                      if self.path!='/status':self.respond(404);return
                      with lock:body=json.dumps({'received':sorted(received)}).encode()
                      self.respond(200,body)
                  def do_PUT(self):
                      match=re.fullmatch(r'/chunks/(\d{1,3})',self.path)
                      if not match:self.respond(404);return
                      index=int(match[1]);length=min(chunk_size,size-index*chunk_size)
                      if not 0<=index<len(chunk_hashes) or self.headers.get('Content-Length')!=str(length):self.respond(400);return
                      if not slots.acquire(blocking=False):self.respond(503);return
                      try:
                          self.connection.settimeout(60);body=self.rfile.read(length)
                          if len(body)!=length or hashlib.sha256(body).hexdigest()!=chunk_hashes[index]:self.respond(400);return
                          with lock:
                              if index not in received:
                                  (work/f'part-{index}').write_bytes(body);received.add(index)
                          self.respond(200,b'verified')
                      finally:slots.release()
              server=http.server.ThreadingHTTPServer(('127.0.0.1',0),Receiver)
              threading.Thread(target=server.serve_forever,daemon=True).start()
              tunnel=None;endpoint_asset=None
              try:
                  # Fixed official binary, no installer, no privileged service or auto-update.
                  url='https://github.com/cloudflare/cloudflared/releases/download/2026.11.0/cloudflared-linux-amd64'
                  with urllib.request.urlopen(url,timeout=120) as response:binary=response.read(40_283_100)
                  if len(binary)!=40_283_099 or hashlib.sha256(binary).hexdigest()!='51f7c68b57ed7269164075d7e789efce5b59355982f06392deeb037d982a51fd':
                      raise SystemExit('Official tunnel binary digest mismatch')
                  cli=work/'cloudflared';cli.write_bytes(binary);cli.chmod(0o700);del binary
                  # Source audit found hardcoded crash reporting to sentry.io. Block that
                  # hostname in this disposable runner before starting the vendor binary.
                  subprocess.run(['sudo','sh','-c',"printf '\\n127.0.0.1 sentry.io # hongguo-release-disable-crash-reporting\\n' >> /etc/hosts"],check=True)
                  if {a[4][0] for a in socket.getaddrinfo('sentry.io',443)} != {'127.0.0.1'}:
                      raise SystemExit('Crash reporting block could not be verified')
                  tunnel_env={k:v for k,v in os.environ.items() if k in ('PATH','LANG','LC_ALL','TMPDIR')}
                  tunnel=subprocess.Popen([str(cli),'tunnel','--url',f'http://127.0.0.1:{server.server_port}','--protocol','http2','--no-autoupdate','--metrics','127.0.0.1:0'],env=tunnel_env,stdout=subprocess.PIPE,stderr=subprocess.STDOUT)
                  origins=queue.Queue()
                  def read_origin():
                      # Raw process output, including provisioning diagnostics, stays in memory.
                      for line in tunnel.stdout:
                          match=re.search(rb'https://[a-z0-9-]+\.trycloudflare\.com',line)
                          if match:origins.put(match[0].decode())
                  threading.Thread(target=read_origin,daemon=True).start()
                  origin=origins.get(timeout=120)
                  # This public descriptor is informational: there is no bearer token or secret URL path.
                  # PUT accepts only the predeclared public installer chunks after SHA-256 checks.
                  descriptor=work/f'transfer-receiver-{version}.json'
                  descriptor.write_text(json.dumps({'version':version,'sha256':expected,'size':size,'chunkSize':chunk_size,'count':len(chunk_hashes),'endpoint':origin}))
                  subprocess.run(['gh','release','upload',f'v{version}',str(descriptor),'--repo',repo],check=True)
                  endpoint_asset=next(a['id'] for a in release()['assets'] if a['name']==descriptor.name)
                  print('Receiver ready; only declared installer chunks accepted',flush=True)
                  deadline=time.monotonic()+25*60;previous=-1
                  while time.monotonic()<deadline:
                      with lock:count=len(received)
                      if count!=previous:print(f'Verified chunks {count}/{len(chunk_hashes)}',flush=True);previous=count
                      if count==len(chunk_hashes):break
                      if tunnel.poll() is not None:raise SystemExit('Temporary tunnel exited')
                      time.sleep(1)
                  else:raise SystemExit('Installer transfer timed out')
                  server.shutdown();tunnel.terminate();tunnel.wait(timeout=15)
                  package=work/filename;digest=hashlib.sha256()
                  with package.open('wb') as target:
                      for index in range(len(chunk_hashes)):
                          body=(work/f'part-{index}').read_bytes();digest.update(body);target.write(body)
                  if package.stat().st_size!=size or digest.hexdigest()!=expected:raise SystemExit('Full installer verification failed')
                  current=release()
                  if not current['isDraft'] or any(a['name']==filename for a in current['assets']):raise SystemExit('Draft changed')
                  subprocess.run(['gh','release','upload',f'v{version}',str(package),'--repo',repo],check=True)
                  result=release();asset=next((a for a in result['assets'] if a['name']==filename),{})
                  if not result['isDraft'] or not valid(asset):raise SystemExit('Uploaded installer differs')
                  print('Original package verified and uploaded. Release remains a draft.',flush=True)
              finally:
                  server.shutdown();server.server_close()
                  if tunnel and tunnel.poll() is None:
                      tunnel.terminate()
                      try:tunnel.wait(timeout=15)
                      except subprocess.TimeoutExpired:tunnel.kill();tunnel.wait()
                  if endpoint_asset:
                      subprocess.run(['gh','api','--method','DELETE',f'repos/{repo}/releases/assets/{endpoint_asset}'],check=True)
          PYCODE
