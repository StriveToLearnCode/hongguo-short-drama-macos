name: Assemble verified release from GitHub blobs
on:
  workflow_dispatch:
    inputs:
      version: {required: true, type: string}
      sha256: {required: true, type: string}
      size: {required: true, type: string}
      chunks: {required: true, type: string}
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Verify original package and upload to existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          PACKAGE_SHA256: ${{ inputs.sha256 }}
          PACKAGE_SIZE: ${{ inputs.size }}
          PACKAGE_CHUNKS: ${{ inputs.chunks }}
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess, tempfile
          version, expected, raw_size = (os.environ[k] for k in ('RELEASE_VERSION', 'PACKAGE_SHA256', 'PACKAGE_SIZE'))
          chunks = os.environ['PACKAGE_CHUNKS'].split(',')
          if not re.fullmatch(r'\d+\.\d+\.\d+', version) or not re.fullmatch('[a-f0-9]{64}', expected):
              raise SystemExit('Invalid version or digest')
          if not re.fullmatch(r'\d{1,10}', raw_size) or not 0 < int(raw_size) <= 2_000_000_000:
              raise SystemExit('Invalid package size')
          if not 1 <= len(chunks) <= 500 or any(not re.fullmatch('[a-f0-9]{40}', s) for s in chunks):
              raise SystemExit('Invalid chunk identifiers')
          repo = os.environ['GH_REPO']
          filename = f'HongguoMac-{version}-universal.dmg'
          def gh_json(*args):
              return json.loads(subprocess.check_output(['gh', *args]))
          def release():
              return gh_json('release', 'view', f'v{version}', '--repo', repo, '--json', 'isDraft,isPrerelease,assets')
          draft = release()
          if not draft['isDraft'] or draft['isPrerelease']:
              raise SystemExit('Expected existing stable draft')
          def valid(asset):
              return asset.get('state') == 'uploaded' and asset.get('size') == int(raw_size) and asset.get('digest') == 'sha256:' + expected
          existing = next((a for a in draft['assets'] if a['name'] == filename), None)
          if existing:
              if valid(existing):
                  print('Exact package already uploaded'); raise SystemExit(0)
              raise SystemExit('Existing package differs; review before replacing')
          with tempfile.TemporaryDirectory(prefix='verified-release-') as temporary:
              package = pathlib.Path(temporary) / filename
              digest = hashlib.sha256(); size = 0
              with package.open('wb') as target:
                  for index, sha in enumerate(chunks):
                      blob = gh_json('api', f'repos/{repo}/git/blobs/{sha}')
                      if blob.get('encoding') != 'base64':
                          raise SystemExit('Unexpected blob encoding')
                      data = base64.b64decode(blob['content'])
                      actual = hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
                      if blob['sha'] != sha or actual != sha or not 0 < len(data) <= 4 * 1024 * 1024:
                          raise SystemExit('Chunk verification failed')
                      size += len(data)
                      if size > int(raw_size):
                          raise SystemExit('Oversized package')
                      digest.update(data); target.write(data)
                      print(f'Verified chunk {index + 1}/{len(chunks)}', flush=True)
              if size != int(raw_size) or digest.hexdigest() != expected:
                  raise SystemExit('Complete installer size or SHA-256 mismatch')
              current = release()
              if not current['isDraft'] or any(a['name'] == filename for a in current['assets']):
                  raise SystemExit('Draft changed during verification')
              subprocess.run(['gh', 'release', 'upload', f'v{version}', str(package), '--repo', repo], check=True)
              result = release()
              asset = next((a for a in result['assets'] if a['name'] == filename), {})
              if not result['isDraft'] or not valid(asset):
                  raise SystemExit('Uploaded package verification failed')
              print('Original installer verified and uploaded. Release remains a draft.')
          PY
