name: Receive v1.3.2 verified package
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Receive and verify the fixed v1.3.2 package
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          script: |
            const crypto = require('node:crypto');
            const fs = require('node:fs');
            const path = require('node:path');
            const cp = require('node:child_process');
            const base = 'https://hongguo-release-transfer-132.pages.dev/';
            const expectedSHA = 'c598f1a7d15e41e9eb02781cb1ead20acc33005e8f2c584f14b93ef1935aec8b';
            const filename = 'HongguoMac-1.3.2-universal.dmg';
            const tag = 'v1.3.2';
            const repo = context.repo;
            const releases = await github.paginate(github.rest.repos.listReleases, repo);
            const release = releases.find(item => item.tag_name === tag);
            if (!release?.draft || release.prerelease) throw Error('Expected existing stable draft');
            const old = release.assets.find(item => item.name === filename);
            if (old) {
              if (old.digest === `sha256:${expectedSHA}` && old.state === 'uploaded') { core.info('Exact package already uploaded'); return; }
              throw Error('Unexpected existing asset');
            }
            const response = await fetch(new URL('manifest.json', base), {redirect:'error', signal:AbortSignal.timeout(30000)});
            if (!response.ok) throw Error('Manifest unavailable');
            const text = await response.text();
            if (text.length > 131072) throw Error('Manifest too large');
            const manifest = JSON.parse(text);
            if (manifest.filename !== filename || manifest.sha256 !== expectedSHA || !Number.isSafeInteger(manifest.size) || manifest.size > 400000000 || !Array.isArray(manifest.parts) || manifest.parts.length !== 301) throw Error('Unexpected manifest');
            if (manifest.parts.reduce((size, part) => size + part.size, 0) !== manifest.size) throw Error('Invalid total size');
            let next = 0;
            const receive = async () => {
              while (next < manifest.parts.length) {
                const index = next++;
                const part = manifest.parts[index];
                if (part.name !== `part-${String(index).padStart(3,'0')}.bin` || !Number.isSafeInteger(part.size) || part.size <= 0 || part.size > 1048576 || !/^[a-f0-9]{64}$/.test(part.sha256)) throw Error('Invalid chunk');
                let accepted = false;
                for (let attempt = 0; attempt < 3; attempt++) {
                  try {
                    const reply = await fetch(new URL(part.name,base), {redirect:'error', signal:AbortSignal.timeout(120000)});
                    if (!reply.ok || Number(reply.headers.get('content-length')) !== part.size) throw Error('Unexpected chunk response');
                    const bytes = Buffer.from(await reply.arrayBuffer());
                    if (bytes.length !== part.size || crypto.createHash('sha256').update(bytes).digest('hex') !== part.sha256) throw Error('Chunk hash mismatch');
                    fs.writeFileSync(path.join(process.env.RUNNER_TEMP, part.name), bytes);
                    accepted = true; core.info(`Verified chunk ${index+1}/301`); break;
                  } catch (error) { if (attempt === 2) throw error; }
                }
                if (!accepted) throw Error('Chunk unavailable');
              }
            };
            await Promise.all(Array.from({length:4}, receive));
            const file = path.join(process.env.RUNNER_TEMP, filename);
            for (const part of manifest.parts) fs.appendFileSync(file, fs.readFileSync(path.join(process.env.RUNNER_TEMP,part.name)));
            const hash = crypto.createHash('sha256');
            for await (const bytes of fs.createReadStream(file)) hash.update(bytes);
            if (fs.statSync(file).size !== manifest.size || hash.digest('hex') !== expectedSHA) throw Error('Whole package mismatch');
            const current = (await github.rest.repos.getRelease({...repo,release_id:release.id})).data;
            if (!current.draft || current.assets.some(item => item.name === filename)) throw Error('Draft changed during transfer');
            cp.execFileSync('gh',['release','upload',tag,file,'--repo',`${repo.owner}/${repo.repo}`],{stdio:'inherit'});
            const result = (await github.rest.repos.getRelease({...repo,release_id:release.id})).data;
            const asset = result.assets.find(item => item.name === filename);
            if (!result.draft || !asset || asset.size !== manifest.size || asset.digest !== `sha256:${expectedSHA}` || asset.state !== 'uploaded') throw Error('Uploaded package verification failed');
            core.info('Original package verified in draft; publication remains a separate gated step');
